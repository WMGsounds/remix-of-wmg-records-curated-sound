name: Sync Notion content

# Manual only: pulls Notion into the committed /content snapshot that the
# Vercel build reads. The Vercel build itself never talks to Notion.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sync:content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ARTISTS_DB_ID: ${{ secrets.NOTION_ARTISTS_DB_ID }}
          NOTION_RELEASES_DB_ID: ${{ secrets.NOTION_RELEASES_DB_ID }}
          NOTION_TRACKS_DB_ID: ${{ secrets.NOTION_TRACKS_DB_ID }}
          NOTION_RELEASE_TRACKS_DB_ID: ${{ secrets.NOTION_RELEASE_TRACKS_DB_ID }}
          NOTION_JOURNAL_DB_ID: ${{ secrets.NOTION_JOURNAL_DB_ID }}
          NOTION_STORE_DB_ID: ${{ secrets.NOTION_STORE_DB_ID }}
          NOTION_GALLERY_DATABASE_ID: ${{ secrets.NOTION_GALLERY_DATABASE_ID }}
          NOTION_VIDEOS_DATABASE_ID: ${{ secrets.NOTION_VIDEOS_DATABASE_ID }}
      - name: Commit updated content
        run: |
          git config user.name "wmg-content-bot"
          git config user.email "actions@github.com"
          git add content
          git diff --staged --quiet || git commit -m "chore: sync Notion content"
          git push
